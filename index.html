<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apprenons tibétaines prononciations</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #141414;
      color: #FFFFFF;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
    }
    #app {
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 800px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
    }
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .screen.active {
      display: flex;
    }
    h1 {
      font-size: 2.5rem;
      line-height: 1.4;
      white-space: pre-line;
      margin-bottom: 2rem;
    }
    .btn {
      background: #646464;
      color: #FFF;
      border: 5px solid #282828;
      padding: 15px 30px;
      font-size: 1.5rem;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #505050;
    }
    .tibetan-display {
      font-size: 5rem;
      margin: 20px 0;
    }
    .history-box {
      text-align: left;
      width: 100%;
      background: #202020;
      padding: 15px;
      border-radius: 8px;
      margin: 10px 0;
      box-sizing: border-box;
      font-size: 1.1rem;
    }
    .result-status {
      font-weight: bold;
      font-size: 1.2rem;
      margin-top: 5px;
    }
    .correct { color: #96E77F; }
    .incorrect { color: #E77F7F; }
    textarea {
      width: 100%;
      height: 80px;
      background: #404040;
      color: #FFFFFF;
      font-size: 2rem;
      border: none;
      padding: 10px;
      box-sizing: border-box;
      resize: none;
      margin-top: 10px;
    }
    .hints {
      font-size: 1rem;
      color: #888;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- タイトル画面 -->
    <div id="title-screen" class="screen active">
      <h1>Apprenons<br>tibétaines<br>prononciations.</h1>
      <button class="btn" id="start-btn">Commence</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen">
      <div class="hints">x:＼ q:／ z:ᐱ</div>
      <div>
        <div style="font-size: 1.5rem;">Qu'est-ce la prononciation de</div>
        <div class="tibetan-display" id="tibetan-char"></div>
      </div>
      
      <div style="width: 100%;">
        <div class="history-box">
          <div id="history-utkoman">Útkoman: -</div>
          <div id="history-svarid">Svarið: -</div>
          <div class="result-status" id="history-status">Aðstæðurnar: -</div>
        </div>
        
        <textarea id="user-input" placeholder="Type answer and press Enter..."></textarea>
      </div>
    </div>
  </div>

  <script>
    let tibetans = []
    let lastCons = ["","ག","ང","བ","མ","འ","ར","ད","ན","ལ","ས","གས","ངས","བས","མས"]
    let lastConsIndex = 0
    let lastConsLetter = ""
    let currentLetter = ""
    let currentAnswer = []
    let prevAnswer = []
    let prevUserAnswer = ""
    let prevLetter = ""
    let prevLastConsLetter = ""

    async function initGame() {
      let tibetans_raw = []
      for(let i = 1; i <= 4; i++){
        try {
          let res = await fetch(`${i}.txt`)
          let text = await res.text()
          let lines = text.split("\n").filter(l => l.trim() !== "")
          tibetans_raw.push(lines)
        } catch(e) {
          console.error(`Failed to load ${i}.txt`, e)
          tibetans_raw.push([])
        }
      }
      
      for(let i = 0; i < 4; i++){
        tibetans[i] = []
        for(let j = 0; j < tibetans_raw[i].length; j++){
          let temp = tibetans_raw[i][j].trim().split(" ")
          tibetans[i][j] = {"letter": temp[0], "pro": temp.slice(1)}
        }
      }
    }

    function nextQues(){
      prevLetter = currentLetter
      prevAnswer = [...currentAnswer]
      prevLastConsLetter = lastConsLetter
      
      lastConsIndex = Math.floor(Math.random() * lastCons.length)
      lastConsLetter = lastCons[lastConsIndex]
      
      let validTibetans = tibetans.filter(t => t && t.length > 0)
      if (validTibetans.length > 0) {
        let temp = validTibetans[Math.floor(Math.random() * validTibetans.length)]
        let currentTibetan = temp[Math.floor(Math.random() * temp.length)]
        currentLetter = currentTibetan.letter
        currentAnswer = [...currentTibetan.pro]
      }
      
      let tone = 0
      if(currentAnswer.length > 0 && currentAnswer[0].slice(-1) === "á") tone = 1
      currentAnswer = currentAnswer.map(e => e.slice(0, -1))
      
      let vowelType = "0000"  // isNasal, isLong, isFront, isLowered
      let lastConsAnswer = ""
      
      switch(lastConsIndex){
        case 1: vowelType = "0101"; break;  //ག
        case 2: vowelType = "1000"; break;  //ང
        case 3: vowelType = "0001"; lastConsAnswer = "p"; break;  //བ
        case 4: vowelType = "0000"; lastConsAnswer = "m"; break;  //མ
        case 5: vowelType = "0000"; break;  //འ
        case 6: vowelType = "0100"; break;  //ར
        case 7: vowelType = "0111"; break;  //ད
        case 8: vowelType = "1010"; break;  //ན
        case 9: vowelType = "0110"; break;  //ལ
        case 10: vowelType = "0111"; break; //ས
        case 11: vowelType = "0101"; break; //གས
        case 12: vowelType = "1001"; break; //ངས
        case 13: vowelType = "0001"; lastConsAnswer = "p"; break; //བས
        case 14: vowelType = "0001"; lastConsAnswer = "m"; break; //མས
      }
      
      let vowel = "a"
      
      if(vowelType == "0000" && tone == 0){  vowel = "a"}
      if(vowelType == "0000" && tone == 1){  vowel = "a"; lastConsAnswer += "q"}
      if(vowelType == "1000" && tone == 0){  vowel = "an"}
      if(vowelType == "1000" && tone == 1){  vowel = "an"; lastConsAnswer += "q"}
      if(vowelType == "0100" && tone == 0){  vowel = "aa"}
      if(vowelType == "0100" && tone == 1){  vowel = "aa"; lastConsAnswer += "q"}
      if(vowelType == "0001" && tone == 0){  vowel = "a"; lastConsAnswer += "x"}
      if(vowelType == "0001" && tone == 1){  vowel = "a"; lastConsAnswer += "z"}
      if(vowelType == "0101" && tone == 0){  vowel = "aa"; lastConsAnswer += "x"}
      if(vowelType == "0101" && tone == 1){  vowel = "aa"; lastConsAnswer += "z"}
      if(vowelType == "1001" && tone == 0){  vowel = "an"; lastConsAnswer += "x"}
      if(vowelType == "1001" && tone == 1){  vowel = "an"; lastConsAnswer += "z"}
      if(vowelType == "0110" && tone == 0){  vowel = "ää"}
      if(vowelType == "0110" && tone == 1){  vowel = "ää"; lastConsAnswer += "q"}
      if(vowelType == "1010" && tone == 0){  vowel = "än"}
      if(vowelType == "1010" && tone == 1){  vowel = "än"; lastConsAnswer += "q"}
      if(vowelType == "0011" && tone == 0){  vowel = "ä"; lastConsAnswer += "x"}
      if(vowelType == "0011" && tone == 1){  vowel = "ä"; lastConsAnswer += "z"}
      if(vowelType == "0111" && tone == 0){  vowel = "ää"; lastConsAnswer += "x"}
      if(vowelType == "0111" && tone == 1){  vowel = "ää"; lastConsAnswer += "z"}
      
      currentAnswer = currentAnswer.map(e => e + vowel + lastConsAnswer)
      updateScreen()
    }

    function updateScreen() {
      document.getElementById("tibetan-char").innerText = currentLetter + " " + lastConsLetter + "་"
      document.getElementById("history-utkoman").innerText = "Útkoman: " + prevAnswer.join(" ") + " (" + prevLetter + " " + prevLastConsLetter + ")"
      document.getElementById("history-svarid").innerText = "Svarið: " + prevUserAnswer
      
      let statusEl = document.getElementById("history-status")
      if(prevAnswer.join(" ") === prevUserAnswer && prevUserAnswer !== ""){
        statusEl.innerText = "Aðstæðurnar: Réttur"
        statusEl.className = "result-status correct"
      } else if(prevUserAnswer !== "") {
        statusEl.className = "result-status incorrect"
        statusEl.innerText = "Aðstæðurnar: Rangur"
      } else {
        statusEl.innerText = "Aðstæðurnar: -"
        statusEl.className = "result-status"
      }
    }

    document.getElementById("start-btn").addEventListener("click", async () => {
      await initGame()
      nextQues()
      document.getElementById("title-screen").classList.remove("active")
      document.getElementById("game-screen").classList.add("active")
    })

    document.getElementById("user-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault()
        let inputStr = e.target.value.toLowerCase().replaceAll("\n", "").trim()
        prevUserAnswer = inputStr
        nextQues()
        e.target.value = ""
      }
    })
  </script>
</body>
</html>
