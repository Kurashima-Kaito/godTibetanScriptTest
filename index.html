<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apprenons tibétaines prononciations</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #141414;
      color: #FFFFFF;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
    }
    #app {
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 800px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
    }
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .screen.active {
      display: flex;
    }
    h1 {
      font-size: 2.3rem;
      line-height: 1.4;
      white-space: pre-line;
      margin-bottom: 1.5rem;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 80%;
      max-width: 300px;
    }
    .btn {
      background: #646464;
      color: #FFF;
      border: 5px solid #282828;
      padding: 15px 20px;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #505050;
    }
    .tibetan-display {
      font-size: 3.5rem;
      margin: 20px 0;
      word-break: break-all;
    }
    .orange-text {
      color: #FFB74D;
    }
    .history-box {
      text-align: left;
      width: 100%;
      background: #202020;
      padding: 15px;
      border-radius: 8px;
      margin: 10px 0;
      box-sizing: border-box;
      font-size: 1.1rem;
    }
    .result-status {
      font-weight: bold;
      font-size: 1.2rem;
      margin-top: 5px;
    }
    .correct { color: #96E77F; }
    .incorrect { color: #E77F7F; }
    textarea {
      width: 100%;
      height: 80px;
      background: #404040;
      color: #FFFFFF;
      font-size: 1.8rem;
      border: none;
      padding: 10px;
      box-sizing: border-box;
      resize: none;
      margin-top: 10px;
    }
    .hints {
      font-size: 1rem;
      color: #888;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- タイトル画面 -->
    <div id="title-screen" class="screen active">
      <h1>Apprenons<br>tibétaines<br>prononciations.</h1>
      <div class="btn-container">
        <button class="btn" id="start-1-btn">1音節モード</button>
        <button class="btn" id="start-3-btn">3音節モード</button>
      </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen">
      <div class="hints">x:＼ q:／ z:ᐱ</div>
      <div>
        <div style="font-size: 1.3rem;">Qu'est-ce la prononciation de</div>
        <div class="tibetan-display" id="tibetan-char"></div>
      </div>
      
      <div style="width: 100%;">
        <div class="history-box">
          <div id="history-utkoman">Útkoman: -</div>
          <div id="history-svarid">Svarið: -</div>
          <div class="result-status" id="history-status">Aðstæðurnar: -</div>
        </div>
        
        <textarea id="user-input" placeholder="Type answer and press Enter..."></textarea>
      </div>
    </div>
  </div>

  <script>
    let tibetans = []
    let lastCons = ["","ག","ང","བ","མ","འ","ར","ད","ན","ལ","ས","གས","ངས","བས","མས"]
    let mode = 1 // 1 または 3
    
    let currentSyllables = []
    let prevSyllables = []
    let prevAnswerStr = ""
    let prevUserAnswer = ""

    async function initGame() {
      let tibetans_raw = []
      for(let i = 1; i <= 4; i++){
        try {
          let res = await fetch(`${i}.txt`)
          let text = await res.text()
          let lines = text.split("\n").filter(l => l.trim() !== "")
          tibetans_raw.push(lines)
        } catch(e) {
          console.error(`Failed to load ${i}.txt`, e)
          tibetans_raw.push([])
        }
      }
      
      for(let i = 0; i < 4; i++){
        tibetans[i] = []
        for(let j = 0; j < tibetans_raw[i].length; j++){
          let temp = tibetans_raw[i][j].trim().split(" ")
          tibetans[i][j] = {"letter": temp[0], "pro": temp.slice(1)}
        }
      }
    }

    function generateSingleSyllable() {
      let lastConsIndex = Math.floor(Math.random() * lastCons.length)
      let lastConsLetter = lastCons[lastConsIndex]
      
      let validTibetans = tibetans.filter(t => t && t.length > 0)
      let temp = validTibetans[Math.floor(Math.random() * validTibetans.length)]
      let currentTibetan = temp[Math.floor(Math.random() * temp.length)]
      let currentLetter = currentTibetan.letter
      let currentAnswer = [...currentTibetan.pro]
      
      let tone = 0
      if(currentAnswer.length > 0 && currentAnswer[0].slice(-1) === "á") tone = 1
      currentAnswer = currentAnswer.map(e => e.slice(0, -1))
      
      let vowelType = "0000" //isNasal, isLong, isFront, isLowered
      let lastConsAnswer = ""
      
      switch(lastConsIndex){
        case 1: vowelType = "0101"; break;  //ག
        case 2: vowelType = "1000"; break;  //ང
        case 3: vowelType = "0001"; lastConsAnswer = "p"; break;  //བ
        case 4: vowelType = "0000"; lastConsAnswer = "m"; break;  //མ
        case 5: vowelType = "0000"; break;  //འ
        case 6: vowelType = "0100"; break;  //ར
        case 7: vowelType = "0111"; break;  //ད
        case 8: vowelType = "1010"; break;  //ན
        case 9: vowelType = "0110"; break;  //ལ
        case 10: vowelType = "0111"; break; //ས
        case 11: vowelType = "0101"; break; //གས
        case 12: vowelType = "1001"; break; //ངས
        case 13: vowelType = "0001"; lastConsAnswer = "p"; break; //བས
        case 14: vowelType = "0001"; lastConsAnswer = "m"; break; //མས
      }
      
      let vowel = "a"
      if(vowelType == "0000" && tone == 0){  vowel = "a"}
      else if(vowelType == "0000" && tone == 1){  vowel = "a"; lastConsAnswer += "q"}
      else if(vowelType == "1000" && tone == 0){  vowel = "an"}
      else if(vowelType == "1000" && tone == 1){  vowel = "an"; lastConsAnswer += "q"}
      else if(vowelType == "0100" && tone == 0){  vowel = "aa"}
      else if(vowelType == "0100" && tone == 1){  vowel = "aa"; lastConsAnswer += "q"}
      else if(vowelType == "0001" && tone == 0){  vowel = "a"; lastConsAnswer += "x"}
      else if(vowelType == "0001" && tone == 1){  vowel = "a"; lastConsAnswer += "z"}
      else if(vowelType == "1101" && tone == 0){  vowel = "än"; lastConsAnswer += "x"}
      else if(vowelType == "1101" && tone == 1){  vowel = "än"; lastConsAnswer += "z"}
      else if(vowelType == "0101" && tone == 0){  vowel = "aa"; lastConsAnswer += "x"}
      else if(vowelType == "0101" && tone == 1){  vowel = "aa"; lastConsAnswer += "z"}
      else if(vowelType == "1001" && tone == 0){  vowel = "an"; lastConsAnswer += "x"}
      else if(vowelType == "1001" && tone == 1){  vowel = "an"; lastConsAnswer += "z"}
      else if(vowelType == "0110" && tone == 0){  vowel = "ää"}
      else if(vowelType == "0110" && tone == 1){  vowel = "ää"; lastConsAnswer += "q"}
      else if(vowelType == "1010" && tone == 0){  vowel = "än"}
      else if(vowelType == "1010" && tone == 1){  vowel = "än"; lastConsAnswer += "q"}
      else if(vowelType == "0011" && tone == 0){  vowel = "ä"; lastConsAnswer += "x"}
      else if(vowelType == "0011" && tone == 1){  vowel = "ä"; lastConsAnswer += "z"}
      else if(vowelType == "0111" && tone == 0){  vowel = "ää"; lastConsAnswer += "x"}
      else if(vowelType == "0111" && tone == 1){  vowel = "ää"; lastConsAnswer += "z"}
      
      currentAnswer = currentAnswer.map(e => e + vowel + lastConsAnswer)
      
      return {
        letter: currentLetter,
        lastCons: lastConsLetter,
        pro: currentAnswer
      }
    }

    function nextQues(){
      prevSyllables = [...currentSyllables]
      prevAnswerStr = prevSyllables.map(s => s.pro[0]).join(" ")
      
      currentSyllables = []
      let count = (mode === 3) ? 3 : 1
      for(let i = 0; i < count; i++){
        currentSyllables.push(generateSingleSyllable())
      }
      
      updateScreen()
    }

    function renderDisplay(syllables) {
      if (!syllables || syllables.length === 0) return ""
      return syllables.map(s => `${s.letter}<span class="orange-text">${s.lastCons}</span>`).join("་") + "་"
    }

    function updateScreen() {
      document.getElementById("tibetan-char").innerHTML = renderDisplay(currentSyllables)
      
      let prevText = prevSyllables.length > 0 ? prevSyllables.map(s => `${s.letter}${s.lastCons}`).join(" ") : "-"
      document.getElementById("history-utkoman").innerText = "Útkoman: " + prevAnswerStr + (prevText !== "-" ? " (" + prevText + ")" : "")
      document.getElementById("history-svarid").innerText = "Svarið: " + prevUserAnswer
      
      let statusEl = document.getElementById("history-status")
      if(prevAnswerStr !== "" && prevAnswerStr === prevUserAnswer){
        statusEl.innerText = "Aðstæðurnar: Réttur"
        statusEl.className = "result-status correct"
      } else if(prevUserAnswer !== "") {
        statusEl.className = "result-status incorrect"
        statusEl.innerText = "Aðstæðurnar: Rangur"
      } else {
        statusEl.innerText = "Aðstæðurnar: -"
        statusEl.className = "result-status"
      }
    }

    async function startGame(selectedMode) {
      mode = selectedMode
      await initGame()
      nextQues()
      document.getElementById("title-screen").classList.remove("active")
      document.getElementById("game-screen").classList.add("active")
    }

    document.getElementById("start-1-btn").addEventListener("click", () => startGame(1))
    document.getElementById("start-3-btn").addEventListener("click", () => startGame(3))

    document.getElementById("user-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault()
        let inputStr = e.target.value.toLowerCase().replaceAll("\n", "").trim().replace(/\s+/g, ' ')
        prevUserAnswer = inputStr
        nextQues()
        e.target.value = ""
      }
    })
  </script>
</body>
</html>
